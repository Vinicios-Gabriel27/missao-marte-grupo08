name: Testes

on:
  push:
  pull_request:

jobs:
  fase-02-gradle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-02-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-02-java${{ matrix.java }}
          path: fase-02-gradle/build/reports/tests/test

  fase-03-libgdx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-03-libgdx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build (core + desktop)
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-03-java${{ matrix.java }}
          path: fase-03-libgdx/core/build/reports/tests/test

  executar-jogo:
    # Abre o jogo num monitor virtual (Xvfb + Mesa), joga sozinho 45 s e salva capturas de tela.
    runs-on: ubuntu-latest
    needs: fase-03-libgdx
    defaults:
      run:
        working-directory: fase-03-libgdx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v4
      - name: Monitor virtual
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Executar o jogo (modo demonstração)
        env:
          MISSAOMARTE_DEMO: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x gradlew
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :lwjgl3:run --console=plain 2>&1 | tee execucao.log || true
          ls -la *.png || echo "nenhuma captura"
      - name: Capturas e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-jogo
          path: |
            fase-03-libgdx/execucao.log
            fase-03-libgdx/*.png
