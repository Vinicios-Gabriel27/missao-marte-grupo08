name: Testes

on:
  push:
  pull_request:

jobs:
  fase-02-gradle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-02-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-02-java${{ matrix.java }}
          path: fase-02-gradle/build/reports/tests/test

  fase-03-libgdx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-03-libgdx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build (core + desktop)
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-03-java${{ matrix.java }}
          path: fase-03-libgdx/core/build/reports/tests/test

  fase-04-interface-grafica:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-04-interface-grafica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build (core + desktop)
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-04-java${{ matrix.java }}
          path: fase-04-interface-grafica/core/build/reports/tests/test

  fase-05-cliente:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-05-servidor-ranking/cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build (core + desktop)
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-fase-05-cliente-java${{ matrix.java }}
          path: fase-05-servidor-ranking/cliente/core/build/reports/tests/test
      - name: Publicar log em caso de falha
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || true
          cd /tmp/log && git init -q -b log && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "log cliente java ${{ matrix.java }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" log:log-cliente-${{ matrix.java }}

  fase-05-servidor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    defaults:
      run:
        working-directory: fase-05-servidor-ranking/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e build do servidor
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Teste de ponta a ponta (servidor rodando)
        run: |
          java -jar build/libs/missao-marte-servidor-1.0.jar > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/actuator/health && break; sleep 1; done
          ./teste-api.sh http://localhost:8080
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-servidor-java${{ matrix.java }}
          path: fase-05-servidor-ranking/servidor/build/reports/tests/test
      - name: Publicar log em caso de falha
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || true
          find build/test-results -name '*.xml' -exec cp {} /tmp/log/ \; 2>/dev/null || true
          cd /tmp/log && git init -q -b log && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "log servidor java ${{ matrix.java }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" log:log-servidor-${{ matrix.java }}

  fase-06-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fase-06-android/cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes, desktop e APK
        run: |
          chmod +x gradlew
          ./gradlew build :android:assembleDebug --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Publicar APK em Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk missao-marte-debug.apk
          gh release delete apk-debug --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create apk-debug missao-marte-debug.apk -R ${{ github.repository }} --prerelease \
            --title "APK Android (debug)" --notes "Gerado automaticamente a partir de ${GITHUB_SHA::7}. Build de teste (permite HTTP na rede local)."
      - name: Publicar log em caso de falha
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || true
          cd /tmp/log && git init -q -b log && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "log android"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" log:log-android

  executar-jogo:
    # Abre o jogo num monitor virtual (Xvfb + Mesa), joga sozinho 45 s e salva capturas de tela.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [fase-05-cliente, fase-05-servidor]
    defaults:
      run:
        working-directory: fase-05-servidor-ranking/cliente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v4
      - name: Monitor virtual
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Subir o servidor e semear o ranking
        run: |
          cd ../servidor && chmod +x gradlew && ./gradlew bootJar --console=plain -q
          java -jar build/libs/missao-marte-servidor-1.0.jar > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/actuator/health && break; sleep 1; done
          ./teste-api.sh http://localhost:8080
      - name: Executar o jogo (modo demonstração, conectado ao servidor)
        env:
          MISSAOMARTE_DEMO: '1'
          MISSAOMARTE_SERVIDOR: 'http://localhost:8080'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x gradlew
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :lwjgl3:run --console=plain 2>&1 | tee execucao.log || true
          ls -la *.png || echo "nenhuma captura"
      - name: Capturas e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-jogo
          path: |
            fase-05-servidor-ranking/cliente/execucao.log
            fase-05-servidor-ranking/cliente/*.png
      - name: Publicar capturas no branch "capturas"
        if: always()
        run: |
          mkdir -p /tmp/capturas && cp execucao.log *.png /tmp/capturas/ 2>/dev/null || true
          cd /tmp/capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Capturas da execução ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
