spring.application.name=missao-marte-servidor

# Rede: por padrão só a própria máquina (o emulador Android alcança via 10.0.2.2).
# Para celular na mesma rede Wi-Fi: MISSAOMARTE_ENDERECO=0.0.0.0
server.address=${MISSAOMARTE_ENDERECO:127.0.0.1}
server.port=${PORT:8080}

# Banco H2 em arquivo; a pasta vem de MISSAOMARTE_DADOS (padrão ./dados).
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Token JWT: segredo (>= 32 caracteres) só por variável de ambiente, nunca no repositório.
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}
missaomarte.jwt.validade-minutos=${MISSAOMARTE_JWT_VALIDADE:120}

# Verificação de saúde para publicação: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
